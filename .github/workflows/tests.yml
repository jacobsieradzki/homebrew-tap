# A formula that pours a binary can only be wrong in ways a real install
# shows: a checksum that moved, an archive laid out differently, a binary
# built for the wrong platform. So install it on every platform it claims.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew on the PATH
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo "/home/linuxbrew/.linuxbrew/bin" >>"$GITHUB_PATH"
          fi
      - run: brew install --formula ./Formula/pyscythe.rb
      - run: brew test ./Formula/pyscythe.rb
      - run: pyscythe --version

  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew audit --strict --online ./Formula/pyscythe.rb
