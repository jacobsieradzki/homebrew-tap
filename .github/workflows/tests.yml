# A formula that pours a binary can only be wrong in ways a real install
# shows: a checksum that moved, an archive laid out differently, a binary
# built for the wrong platform. So install it on every platform it claims.
# Homebrew refuses a formula given by path, so the checkout is put where a
# tap lives and installed by name, which is what a user does anyway.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew on the PATH
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo "/home/linuxbrew/.linuxbrew/bin" >>"$GITHUB_PATH"
          fi
      - name: This checkout is the tap
        run: |
          taps="$(brew --repository)/Library/Taps/jacobsieradzki"
          mkdir -p "$taps"
          cp -R "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
      - run: brew install jacobsieradzki/tap/pyscythe
      - run: brew test jacobsieradzki/tap/pyscythe
      - run: pyscythe --version

  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: This checkout is the tap
        run: |
          taps="$(brew --repository)/Library/Taps/jacobsieradzki"
          mkdir -p "$taps"
          cp -R "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
      - run: brew audit --strict --online jacobsieradzki/tap/pyscythe
